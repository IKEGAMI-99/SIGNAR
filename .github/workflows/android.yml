name: SIGNAR Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signar-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || exit 1
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Keep the same personal-use APK signing certificate
        run: |
          if [ ! -f signing/signar-personal.jks ]; then
            mkdir -p signing
            keytool -genkeypair -noprompt -storetype JKS -keystore signing/signar-personal.jks -storepass android -keypass android -alias signar -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=SIGNAR Personal Test, O=SIGNAR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f signing/signar-personal.jks
            git commit -m "chore: pin personal test signing certificate [skip ci]"
            git push origin HEAD:main
          fi
      - name: Build permanently signed release APK
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
          SIGNING_KEY_ALIAS: signar
        run: |
          export SIGNING_KEYSTORE_PATH="$GITHUB_WORKSPACE/signing/signar-personal.jks"
          export SIGNAR_VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk signar.apk
          sha256sum signar.apk > signar.apk.sha256
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" signar.apk signar.apk.sha256 --target "$(git rev-parse HEAD)" --title "SIGNAR $TAG" --notes "Personal-use Android APK with a fixed test signing certificate. Open the app's Update tab to install newer GitHub Releases."
